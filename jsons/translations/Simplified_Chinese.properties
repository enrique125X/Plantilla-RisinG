Game Mechanics = 游戏机制
War Aversion = 战争厌倦
War Aversion tracks war exhaustion in Major Civilizations (City-States and Barbarians are exempt). = 战争厌倦仅记录主要文明的战争疲惫度（城邦与蛮族不受影响）。
1. Accumulation & Relief = 1. 累积与消退
War turn: +1 | Friendly unit lost: +2 = 战争回合：+1 | 己方单位阵亡：+2
Peace turn: -1 | Enemy defeated: -1 | City conquered (>10): -10 = 和平回合：-1 | 消灭敌军：-1 | 攻占城市（>10）：-10
2. Scaling & Thresholds = 2. 缩放公式与阈值
Every 4 points adds 1 scaling step (floor(level / 4)). Capped at 252 points. = 每积累 4 点增加 1 倍惩罚（floor(等级 / 4)）。上限为 252 点。
From 24 (>23): -2% Gold per 4 pts. = 达到 24（>23）：每 4 点 -2% 金币。
From 36 (>35): +2% Unhappiness from Population per 4 pts. = 达到 36（>35）：每 4 点 人口不满度 +2%。
From 56 (>55): -2% Production, -2% Faith, Rebel spawns per 4 pts. = 达到 56（>55）：每 4 点 -2% 生产力、-2% 信仰、可能出现叛军。
From 100 (>99): -2% Culture, -2% Science, -2% Military Strength per 4 pts. = 达到 100（>99）：每 4 点 -2% 文化、-2% 科技、军事战斗力 -2%。
