Game Mechanics = Mecánicas del Juego
War Aversion = Aversión a la Guerra
War Aversion tracks war exhaustion in Major Civilizations (City-States and Barbarians are exempt). = La Aversión a la Guerra mide el desgaste bélico en Civilizaciones Principales (Ciudades-Estado y Bárbaros están exentos).
1. Accumulation & Relief = 1. Acumulación y Alivio
War turn: +1 | Friendly unit lost: +2 = Turno en guerra: +1 | Baja propia: +2
Peace turn: -1 | Enemy defeated: -1 | City conquered (>10): -10 = Turno en paz: -1 | Enemigo abatido: -1 | Ciudad conquistada (>10): -10
2. Scaling & Thresholds = 2. Escalado y Umbrales
Every 4 points adds 1 scaling step (floor(level / 4)). Capped at 252 points. = Cada 4 puntos suma 1 tramo de penalización (floor(nivel / 4)). Límite máximo: 252 puntos.
From 24 (>23): -2% Gold per 4 pts. = Desde 24 (>23): -2% Oro por cada 4 pts.
From 36 (>35): +2% Unhappiness from Population per 4 pts. = Desde 36 (>35): +2% Infelicidad por Población por cada 4 pts.
From 56 (>55): -2% Production, -2% Faith, Rebel spawns per 4 pts. = Desde 56 (>55): -2% Producción, -2% Fe, Aparición de rebeldes por cada 4 pts.
From 100 (>99): -2% Culture, -2% Science, -2% Military Strength per 4 pts. = Desde 100 (>99): -2% Cultura, -2% Ciencia, -2% Fuerza Militar por cada 4 pts.
